<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PedidosYa · Nunez</title>
<style>
:root{--bg:#0b1017;--bg2:#0e141c;--panel:#131b26;--panel2:#18222f;--line:#233043;--ink:#eef4fb;--muted:#8ea0b5;--green:#1fcf8a;--red:#ff6b6b;--yellow:#ffcf5c;--blue:#5aa9ff;--accent:#fa0050;--cmqbg:rgba(90,169,255,.10);--compbg:rgba(250,0,80,.09);--shadow:0 14px 40px rgba(0,0,0,.35)}
body.light{--bg:#f4f6fa;--bg2:#eef1f6;--panel:#fff;--panel2:#f7f9fc;--line:#dfe4ec;--ink:#1a2430;--muted:#5f6b7a;--green:#0a9d63;--red:#d64545;--yellow:#c98a00;--blue:#2f6fdf;--accent:#fa0050;--cmqbg:rgba(47,111,223,.08);--compbg:rgba(250,0,80,.10);--shadow:0 10px 30px rgba(20,40,80,.10)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);font-family:Inter,Segoe UI,system-ui,Arial,sans-serif;transition:background .3s,color .3s}
.wrap{padding:20px 26px;max-width:1600px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.brand{display:flex;gap:14px;align-items:center}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 14px rgba(250,0,80,.4)}
.brand h1{font-size:26px;margin:0;letter-spacing:.3px}
.brand small{color:var(--muted);font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.iconbtn{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;font-weight:800}
.alert{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);color:var(--muted);border-radius:10px;padding:11px 15px;margin-bottom:14px;font-size:13px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.metric .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.metric .v{font-size:24px;font-weight:900;margin-top:6px}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.tabs button{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer;transition:.15s}
.tabs button:hover{color:var(--ink)}
.tabs button.active{background:var(--panel2);color:var(--ink);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow)}
.search{position:relative;flex:1 1 240px;min-width:200px}
.search input{width:100%;background:transparent;border:0;color:var(--ink);padding:10px 12px 10px 36px;font-size:14px;outline:none}
.search input::placeholder{color:var(--muted)}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
.fdiv{width:1px;align-self:stretch;background:var(--line);margin:4px 2px}
.selminimal{background:transparent;border:0;color:var(--ink);font-size:13px;font-weight:600;padding:9px 8px;border-radius:9px;cursor:pointer;outline:none}
.selminimal:hover{background:var(--panel2)}
.toggles{display:flex;gap:4px;flex-wrap:wrap}
.tg{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);padding:8px 12px;border-radius:999px;cursor:pointer;user-select:none;transition:.15s;border:1px solid transparent}
.tg input{display:none}
.tg .dot{width:15px;height:15px;border-radius:5px;border:1.5px solid var(--line);display:inline-block;position:relative;transition:.15s}
.tg input:checked + .dot{background:var(--accent);border-color:var(--accent)}
.tg input:checked + .dot::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.tg:hover{background:var(--panel2);color:var(--ink)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 2px 4px}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 13px;font-size:12px;cursor:pointer;transition:.15s}
.chip:hover{color:var(--ink);border-color:var(--muted)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tablebox{overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.timeline{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;background:var(--panel)}
.timeline th,.timeline td{border-bottom:1px solid var(--line);padding:9px 12px;font-size:12px;white-space:nowrap;vertical-align:middle}
.timeline th{position:sticky;top:0;background:var(--panel2);color:var(--muted);z-index:4;text-align:center;font-weight:800}
.timeline .product{position:sticky;left:0;background:var(--panel);color:var(--ink);z-index:3;min-width:250px;font-weight:800;text-align:left;cursor:pointer}
.timeline .product:hover{color:var(--blue)}
.timeline th.product{z-index:6;background:var(--panel2);cursor:default}
.timeline th.product:hover{color:var(--muted)}
.timeline tbody tr:hover td{background:var(--panel2)}
.subsku{display:block;color:var(--muted);font-weight:600;font-size:11px;margin-top:3px;max-width:330px;white-space:normal}
.pricecell{min-width:118px;text-align:right}
.fleje{color:var(--muted);text-decoration:line-through;font-weight:700;font-size:11.5px}
.ptc{color:var(--green);font-weight:900;font-size:13.5px}
.dyn{color:var(--green);font-weight:800;font-size:11px;margin-left:3px}
.nodyn .ptc{color:var(--ink)}.nodyn .dyn{color:var(--muted)}
.missing{color:var(--line);text-align:center}
.diff.up{color:var(--red);font-weight:900}.diff.down{color:var(--green);font-weight:900}.diff.flat{color:var(--yellow);font-weight:900}
.tablebox::-webkit-scrollbar{height:12px;width:12px}
.tablebox::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.tablebox::-webkit-scrollbar-thumb:hover{background:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.note{font-size:12px;color:var(--muted)}
.chartPanel{display:none}
.chartPanel.open{display:block}
.chartHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.chartHead h3{margin:0;font-size:15px}
.chartHead .sub{color:var(--muted);font-size:12px;margin-top:2px}
.chartClose{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:800;font-size:12px}
.chartClose:hover{color:var(--ink)}
.chartLegend{display:flex;gap:14px;margin-top:8px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.chartLegend span{display:inline-flex;align-items:center;gap:5px}
.legdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.compareResults{display:flex;flex-direction:column;gap:4px;margin:4px 2px 10px}
.cresult{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
.cresult:hover{border-color:var(--accent);color:var(--ink)}
.cchips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 2px 4px}
.cchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 14px;font-size:12.5px;font-weight:700}
.cchip button{background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer;line-height:1;padding:0 6px}
.cchip button:hover{color:var(--red)}
.compareCards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin:14px 0 4px}
.ccard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.ccard.cheapest{border-color:var(--green)}
.cbadge{position:absolute;top:12px;right:40px;background:var(--green);color:#04241a;font-size:9.5px;font-weight:900;padding:3px 8px;border-radius:999px;letter-spacing:.02em}
.cx{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--muted);font-size:17px;cursor:pointer;padding:4px 6px;line-height:1}
.cx:hover{color:var(--red)}
.ctitle{font-weight:900;font-size:14px;padding-right:22px}
.csub{color:var(--muted);font-size:11px;margin-top:2px;padding-right:22px}
.cprice{margin-top:10px;font-size:17px;font-weight:900;color:var(--ink)}
.cprice .dyn{font-size:11px;margin-left:4px}
.spark{width:100%;height:34px;margin-top:10px;display:block}
.inpanel{margin-top:0}
.inrow{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}
.inblock{min-width:0}
.inlab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;font-weight:800}
.inperiodbtn{padding:9px 13px;font-size:13px}
.calpop{position:absolute;z-index:30;top:100%;left:0;margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);width:300px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:800;font-size:13px}
.calhead button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;font-weight:800}
.calhead button:disabled{opacity:.3;cursor:default}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.calgrid .wd{font-size:10.5px;color:var(--muted);padding:3px 0}
.cday{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:7px 0;font-size:12px}
.cday.av{color:var(--ink);cursor:pointer;background:var(--panel2);font-weight:700}
.cday.av:hover{outline:1px solid var(--accent)}
.cday.inr{background:rgba(250,0,80,.18)}
.cday.ine{background:var(--accent);color:#fff}
.cday:disabled{opacity:.35;cursor:default}
.calfoot{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.calfoot .btnp{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:8px 14px;font-weight:800;cursor:pointer}
.calfoot .btns{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer}
.sklist{position:absolute;z-index:25;left:0;right:0;top:100%;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:260px;overflow:auto}
.skitem{padding:8px 12px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--line)}
.skitem:hover{background:var(--panel2)}
.skitem.on{color:var(--accent);font-weight:800}
.skinput{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:9px 12px;font-size:13px;outline:none}
.cchip.miss{opacity:.55;border-style:dashed}
.chartBox{position:relative;width:100%;height:330px;max-height:330px;overflow:hidden}
.chartBox svg{display:block}
.intip{position:absolute;display:none;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow);z-index:5;max-width:300px;line-height:1.5}
.inleg{max-height:92px;overflow:auto}
.legbtn{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:11.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.legbtn.off{opacity:.4;text-decoration:line-through}
.intable{max-height:520px}
.intable td.skucell{white-space:normal;min-width:260px;max-width:420px}
.inhead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.pgbtn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700}
.pgbtn:disabled{opacity:.35;cursor:default}
.timeline th.sortable{cursor:pointer}
.innotes{font-size:12px;color:var(--muted);line-height:1.6;margin:8px 0 0}
@media(max-width:1000px){.filterbar{flex-direction:column;align-items:stretch}.grid2{grid-template-columns:1fr}.wrap{padding:14px}}
</style>
</head>
<body class="dark">
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="logo">&#128666;</div>
      <div><h1>PedidosYa &middot; Nunez</h1><small>Historico de precios &middot; fleje, PTC y dinamica &middot; 1 lectura diaria</small></div>
    </div>
    <div class="actions">
      <button class="iconbtn" onclick="downloadCSV()">&#8595; CSV</button>
      <button class="iconbtn" id="themeBtn" onclick="toggleTheme()">&#9790; Tema</button>
    </div>
  </div>
  <div class="alert">Precios publicos de PedidosYa Market, tienda Nunez. Regla: 100% OFF = 0%. Packs y combos se excluyen. 1 lectura diaria (~10:15 ART).</div>
  <div class="metrics" id="metrics"></div>
  <div class="tabs">
    <button class="active" data-tab="timeline">Evolucion por SKU</button>
    <button data-tab="preciolitro">Precio/L</button>
    <button data-tab="comparar">&#9876; Comparar</button>
    <button data-tab="heatmap">Heatmap dinamica</button>
    <button data-tab="changes">Cambios</button>
    <button data-tab="insights">Insights</button>
  </div>
  <div class="filterbar">
    <div class="search"><span class="ic">&#128269;</span><input id="q" placeholder="Buscar cerveza..."/></div>
    <div class="fdiv"></div>
    <select id="brand" class="selminimal"><option value="">Todas las marcas</option></select>
    <select id="size" class="selminimal"><option value="">Todos los tamanos</option></select>
    <select id="seg" class="selminimal"><option value="">Todos los segmentos</option></select>
    <div class="fdiv"></div>
    <div class="toggles">
      <label class="tg"><input id="onlyBoth" type="checkbox"><span class="dot"></span>comparables</label>
      <label class="tg"><input id="onlyOffer" type="checkbox"><span class="dot"></span>en oferta</label>
      <label class="tg"><input id="groupBrand" type="checkbox"><span class="dot"></span>agrupar</label>
    </div>
  </div>
  <div class="chips" id="brandChips"></div>
  <div class="panel chartPanel" id="chartPanel"></div>
  <div id="content"><p class="note">Cargando datos...</p></div>
</div>
<script>
let DATA={pivot:[],dates:[],stats:[],fights:[],meta:{}};let tab='timeline';let current=[];let compareIds=new Set();
const fmtMoney=v=>(v==null||v==='')?'-':'$'+Math.round(Number(v)).toLocaleString('es-AR');
const fmtMoneyL=v=>(v==null||v==='')?'-':'$'+Number(v).toLocaleString('es-AR',{maximumFractionDigits:0})+'/L';
const litros=(x,volL)=>(x&&volL)?{fleje:x.fleje/volL,ptc:x.ptc/volL,dinamica:x.dinamica}:null;
const fmtPct=v=>(v==null||v==='')?'-':Math.round(Number(v)*100)+'%';
const fmtDate=d=>d.slice(8,10)+'/'+d.slice(5,7);
const uniq=a=>[...new Set(a.filter(Boolean))].sort();const el=i=>document.getElementById(i);
function toggleTheme(){document.body.classList.toggle('light');document.body.classList.toggle('dark');const light=document.body.classList.contains('light');el('themeBtn').innerHTML=(light?'&#9728; ':'&#9790; ')+'Tema';try{localStorage.setItem('peya_theme',light?'light':'dark');}catch(e){}}
(function(){try{if(localStorage.getItem('peya_theme')==='light'){document.body.classList.remove('dark');document.body.classList.add('light');}}catch(e){}})();
async function cargar(){try{const r=await fetch('./data.json?'+Date.now());DATA=await r.json();buildControls();render();}catch(e){el('content').innerHTML='<div class="panel note">No pude cargar data.json.</div>';}}
function buildControls(){const brands=uniq(DATA.pivot.map(x=>x.marca)),sizes=uniq(DATA.pivot.map(x=>x.calibre)),segs=uniq(DATA.pivot.map(x=>x.segmento));el('brand').innerHTML='<option value="">Todas las marcas</option>'+brands.map(x=>'<option>'+x+'</option>').join('');el('size').innerHTML='<option value="">Todos los tamanos</option>'+sizes.map(x=>'<option>'+x+'</option>').join('');el('seg').innerHTML='<option value="">Todos los segmentos</option>'+segs.map(x=>'<option>'+x+'</option>').join('');el('brandChips').innerHTML=['CMQ','Competencia','Quilmes','Schneider','Andes Origen','Miller','Stella Artois','Heineken','Patagonia','Corona'].map(x=>'<span class="chip" onclick="chip(\''+x+'\',this)">'+x+'</span>').join('');['q','brand','size','seg','onlyBoth','onlyOffer','groupBrand'].forEach(i=>el(i).oninput=render);document.querySelectorAll('.tabs button').forEach(bt=>bt.onclick=()=>{tab=bt.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));bt.classList.add('active');closeChart();render();});}
function chip(x,node){document.querySelectorAll('#brandChips .chip').forEach(c=>c.classList.remove('active'));node.classList.add('active');if(x==='CMQ'||x==='Competencia'){el('brand').value='';el('q').value=x.toLowerCase();}else{el('brand').value=x;el('q').value='';}render();}
const dates=()=>DATA.dates||[];
function rows(){const q=el('q').value.toLowerCase(),b=el('brand').value,s=el('size').value,g=el('seg').value,both=el('onlyBoth').checked,offer=el('onlyOffer').checked,D=dates();return DATA.pivot.filter(r=>(!b||r.marca===b)&&(!s||r.calibre===s)&&(!g||r.segmento===g)&&(!q||(r.sku+' '+r.marca+' '+r.grupo).toLowerCase().includes(q))&&(!both||D.every(d=>r.dates[d]))&&(!offer||D.some(d=>r.dates[d]&&Number(r.dates[d].dinamica)>0)));}
function metrics(rs){const D=dates(),both=rs.filter(r=>D.every(d=>r.dates[d])).length,offer=rs.filter(r=>D.some(d=>r.dates[d]&&r.dates[d].dinamica>0)).length;el('metrics').innerHTML=card('SKUs totales',DATA.pivot.length)+card('Dias',D.length)+card('Mostrando',rs.length)+card('En oferta',offer)+card('Comparables',both)+(DATA.meta&&DATA.meta.generado?card('Actualizado',DATA.meta.generado.slice(5,16)):'');}
function card(k,v){return '<div class="metric"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';}
function priceHtml(x){if(!x)return '<span class="missing">&mdash;</span>';const c=Number(x.dinamica)>0?'':'nodyn';return '<div class="pricecell '+c+'"><div class="fleje">'+fmtMoney(x.fleje)+'</div><span class="ptc">'+fmtMoney(x.ptc)+'</span> <span class="dyn">&minus;'+fmtPct(x.dinamica)+'</span></div>';}
function priceLitroHtml(x,volL){if(!x)return '<span class="missing">&mdash;</span>';if(volL==null)return '<span class="missing" title="Sin volumen cargado en data/volume_reference.json">N/D</span>';const l=litros(x,volL);return '<div class="pricecell"><div class="fleje">'+fmtMoneyL(l.fleje)+'</div><span class="ptc">'+fmtMoneyL(l.ptc)+'</span></div>';}
const cls=v=>v==null?'':v>0?'up':v<0?'down':'flat';
function flat(r){const o={Marca:r.marca,SKU:r.sku,Calibre:r.calibre,Grupo:r.grupo,Segmento:r.segmento};dates().forEach(d=>{const x=r.dates[d]||{};o[fmtDate(d)+' Fleje']=x.fleje??'';o[fmtDate(d)+' PTC']=x.ptc??'';o[fmtDate(d)+' Dinamica']=x.dinamica??'';});return o;}
function flatLitro(r){const o={Marca:r.marca,SKU:r.sku,Calibre:r.calibre,Grupo:r.grupo,Segmento:r.segmento,'Volumen (L)':r.volumen_l??'N/D'};dates().forEach(d=>{const l=litros(r.dates[d],r.volumen_l);o[fmtDate(d)+' Fleje/L']=l?Number(l.fleje.toFixed(3)):'';o[fmtDate(d)+' PTC/L']=l?Number(l.ptc.toFixed(3)):'';});return o;}
function precioLitro(){let rs=rows();metrics(rs);if(el('groupBrand').checked)rs.sort((a,b)=>(a.marca+a.sku).localeCompare(b.marca+b.sku));current=rs.map(flatLitro);const D=dates();let h='<div class="panel" style="padding:12px 14px;margin-bottom:10px"><span class="note">Precio por litro (fleje y PTC) para comparar formatos distintos de forma justa. SKUs sin volumen cargado en <code>data/volume_reference.json</code> muestran <b>N/D</b>.</span></div>';h+='<div class="tablebox"><table class="timeline"><thead><tr><th class="product">Producto</th>'+D.map(d=>'<th>'+fmtDate(d)+'</th>').join('')+'<th>&Delta; Precio/L</th></tr></thead><tbody>';rs.forEach(r=>{const volL=r.volumen_l;const f=litros(r.dates[D[0]],volL),l=litros(r.dates[D[D.length-1]],volL);const vp=(f&&l)?l.ptc-f.ptc:null;h+='<tr><td class="product" onclick="openChart(\''+r.id+'\')">'+r.marca+' '+r.calibre+'<span class="subsku">'+r.sku+'</span></td>'+D.map(d=>'<td>'+priceLitroHtml(r.dates[d],volL)+'</td>').join('')+'<td class="diff '+cls(vp)+'">'+(vp==null?'&mdash;':(vp>0?'+':'')+fmtMoneyL(Math.round(vp)))+'</td></tr>';});return h+'</tbody></table></div>';}

function multiLineChart(ids){const D=dates();const rowsSel=ids.map(id=>DATA.pivot.find(r=>r.id===id)).filter(Boolean);const allVals=rowsSel.flatMap(r=>D.map(d=>r.dates[d]?r.dates[d].ptc:null)).filter(v=>v!=null);if(!allVals.length)return '<p class="note">Sin historico para graficar todavia.</p>';const W=Math.max(600,D.length*70),H=280,padL=70,padR=18,padT=22,padB=34;const min=Math.min(...allVals),max=Math.max(...allVals),span=(max-min)||1;

// Clasificacion de fabricante (EDITABLE). El dataset no trae fabricante: se deriva de la MARCA,
// sin tocar los nombres originales. Se compara contra la marca normalizada (minusculas, sin tildes,
// palabras completas). Lo que no matchee CMQ ni CCU cae en "Otros fabricantes".
const FAB_ORDER=['CMQ','CCU','Otros fabricantes'];
const FAB_BRANDS={
  'CMQ':['quilmes','brahma','stella artois','budweiser','corona','patagonia','andes','andes origen','michelob','michelob ultra','1890'],
  'CCU':['imperial','schneider','heineken','amstel','salta','sol','palermo','bieckert']
};
const FAB_CACHE=new Map();
const normTxt=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function fabOf(r){
  if(FAB_CACHE.has(r.id))return FAB_CACHE.get(r.id);
  const b=' '+normTxt(r.marca)+' ';let f='Otros fabricantes';
  for(const k of ['CMQ','CCU']){if(FAB_BRANDS[k].some(x=>b.includes(' '+x+' '))){f=k;break;}}
  if(f==='Otros fabricantes'&&r.grupo==='CMQ')f='CMQ';
  FAB_CACHE.set(r.id,f);return f;
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDMY=d=>d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4);
const fmtPct1=v=>(v==null||isNaN(v))?'-':(Number(v)*100).toFixed(1).replace('.',',')+'%';
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const dayMs=d=>Date.parse(d+'T00:00:00Z');
const IN_PAGE=25;
const IN={cmp:'off',cFrom:null,cTo:null,from:null,to:null,dFrom:null,dTo:null,calOpen:false,calMonth:null,fabs:new Set(),skus:new Set(),skuOpen:false,group:'fab',mode:'all',hidden:new Set(),tq:'',sortKey:'fecha',sortDir:'desc',page:1};
let IN_AV=null,IN_OBS=[],IN_V={},IN_MISS=new Set(),IN_SERIES=[],IN_PTS={},IN_CMPS=[],IN_RAF=0;

function inAvail(){
  if(IN_AV)return IN_AV;
  const set=new Set();let bad=0;
  DATA.pivot.forEach(r=>Object.keys(r.dates).forEach(d=>{
    const ok=/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(dayMs(d))&&new Date(dayMs(d)).toISOString().slice(0,10)===d;
    if(ok)set.add(d);else bad++;
  }));
  IN_AV={set,list:[...set].sort(),bad};return IN_AV;
}
function inRange(){const av=inAvail();return{lo:IN.from||av.list[0],hi:IN.to||av.list[av.list.length-1]};}

/* Observaciones reales (fecha x SKU) que cumplen todos los filtros. Nada se completa ni se inventa. */
function inBase(){return rows().filter(r=>IN.fabs.size===0||IN.fabs.has(fabOf(r)));}
function inObs(lo0,hi0,sec){
  const av=inAvail(),rg=inRange(),lo=lo0||rg.lo,hi=hi0||rg.hi,seen=new Set(),out=[];
  const v={sinDin:0,fuera:0,dup:0,sosp:0,sinTach:0,badDates:av.bad};
  inBase().forEach(r=>{
    if(IN.skus.size&&!IN.skus.has(r.id))return;
    Object.keys(r.dates).forEach(d=>{
      if(!av.set.has(d)||d<lo||d>hi)return;
      const k=d+'|'+r.id;if(seen.has(k)){v.dup++;return;}seen.add(k);
      const x=r.dates[d]||{};
      let din=(x.dinamica==null||x.dinamica==='')?NaN:Number(x.dinamica);
      if(isNaN(din)){v.sinDin++;din=null;}else if(din<0||din>1){v.fuera++;din=null;}
      const ptc=(x.ptc==null||isNaN(Number(x.ptc)))?null:Number(x.ptc);
      const fl=(x.fleje==null||isNaN(Number(x.fleje)))?null:Number(x.fleje);
      const tach=(fl!=null&&ptc!=null&&fl>ptc)?fl:null;
      if(tach==null)v.sinTach++;
      if(x.sospechoso)v.sosp++;
      out.push({d,id:r.id,sku:r.sku,marca:r.marca,seg:r.segmento,fab:fabOf(r),ptc,tach,din,sosp:!!x.sospechoso});
    });
  });
  if(!sec)IN_V=v;return out;
}
function inMV(o){
  const withD=o.filter(x=>x.din!=null),pos=withD.filter(x=>x.din>0);
  const days=new Set(o.map(x=>x.d)),dd=new Set(pos.map(x=>x.d));
  const ptcs=o.filter(x=>x.ptc!=null).map(x=>x.ptc),tach=o.filter(x=>x.tach!=null).map(x=>x.tach);
  return{dias:days.size,diasDin:dd.size,pctDias:days.size?dd.size/days.size:null,dinPos:pos.length?avg(pos.map(x=>x.din)):null,dinAll:withD.length?avg(withD.map(x=>x.din)):null,dinMax:withD.length?Math.max(...withD.map(x=>x.din)):null,ptcAvg:ptcs.length?avg(ptcs):null,ptcMax:ptcs.length?Math.max(...ptcs):null,tachAvg:tach.length?avg(tach):null,n:o.length};
}

/* ---- Grafico de evolucion (SVG propio, responsive, alto fijo) ---- */
const inColor=i=>i<PALETTE.length?PALETTE[i]:'hsl('+Math.round((i*137.5)%360)+',62%,58%)';
function inAccum(obs,keyFn,labFn,tFn){
  const m=new Map();
  obs.forEach(o=>{
    if(o.din==null||(IN.mode==='pos'&&!(o.din>0)))return;
    const k=keyFn(o);let s=m.get(k);if(!s){s={key:k,label:labFn(o),by:new Map()};m.set(k,s);}
    let a=s.by.get(o.d);if(!a){a={d:o.d,sd:0,sp:0,np:0,n:0};s.by.set(o.d,a);}
    a.sd+=o.din;a.n++;if(o.ptc!=null){a.sp+=o.ptc;a.np++;}
  });
  return[...m.values()].map(s=>({key:s.key,label:s.label,pts:[...s.by.values()].sort((a,b)=>a.d<b.d?-1:1).map(a=>{const t=tFn(a.d);return{d:a.d,t:t.t,lbl:t.lbl,din:a.sd/a.n,ptc:a.np?a.sp/a.np:null,n:a.n};})}));
}
function inBuildSeries(){

function inLines(id,vis,total){
  const box=el(id);if(!box)return;IN_PTS[id]=[];
  if(!vis.length){box.innerHTML='<div class="note" style="padding:60px 0;text-align:center">'+(total?'Todas las series estan ocultas. Activalas desde la leyenda.':'No hay observaciones con dinamica valida para graficar.')+'</div>';return;}
  const W=box.clientWidth||800,H=box.clientHeight||330,pL=46,pR=16,pT=20,pB=30,iw=W-pL-pR,ih=H-pT-pB;
  const all=vis.flatMap(s=>s.pts),ts=all.map(p=>p.t),t0=Math.min(...ts),t1=Math.max(...ts),vmax=Math.max(...all.map(p=>p.din));
  const step=vmax>.5?.1:vmax>.2?.05:.02,ymax=Math.max(step,Math.ceil(vmax/step-1e-9)*step);
  const X=t=>t0===t1?pL+iw/2:pL+(t-t0)/(t1-t0)*iw,Y=v=>pT+ih*(1-v/ymax);
  let svg='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" onmousemove="inHover(event,\''+id+'\')" onmouseleave="inHoverEnd(\''+id+'\')">';
  svg+='<text x="'+pL+'" y="11" font-size="10" font-weight="800" fill="var(--muted)">Dinamica promedio (%)</text>';
  for(let i=0;i<=4;i++){const v=ymax*i/4,gy=Y(v);svg+='<line x1="'+pL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pR)+'" y2="'+gy.toFixed(1)+'" stroke="var(--line)"/><text x="'+(pL-6)+'" y="'+(gy+3.5).toFixed(1)+'" font-size="10" fill="var(--muted)" text-anchor="end">'+(v*100).toFixed(step<.05?1:0)+'%</text>';}
  const lab=new Map();all.forEach(p=>lab.set(p.t,p.lbl));const tl=[...lab.keys()].sort((a,b)=>a-b),every=Math.max(1,Math.ceil(tl.length/Math.max(2,Math.floor(iw/62))));
  tl.forEach((t,i)=>{if(i%every===0)svg+='<text x="'+X(t).toFixed(1)+'" y="'+(H-pB+16)+'" font-size="10" fill="var(--muted)" text-anchor="middle">'+lab.get(t)+'</text>';});
  vis.forEach(s=>{

    s.pts.forEach(p=>{if(seg.length&&(p.t-seg[seg.length-1].t)/864e5>1)flush();seg.push(p);IN_PTS[id].push({x:X(p.t),y:Y(p.din),s,p});});flush();

  });
  svg+='<circle id="'+id+'Hi" r="6" fill="none" stroke="var(--ink)" stroke-width="1.5" style="display:none"/></svg><div class="intip" id="'+id+'Tip"></div>';
  box.innerHTML=svg;
}
function inHover(e,id){

/* ---- Comparacion de periodos: metricas lado a lado + evolucion alineada por dia del periodo ---- */
function inDrawCmp(){
  const box=el('inCmpPanel'),R=cmpRange(),{lo,hi}=inRange();IN_CMPS=[];
  if(IN.cmp==='off'){box.innerHTML='';return;}
  if(!R){box.innerHTML='<div class="panel note">Elegi el periodo de comparacion en "Comparar con".</div>';return;}
  const B=inObs(R.lo,R.hi,true),A=IN_OBS;
  if(!B.length){box.innerHTML='<div class="panel note">No hay datos disponibles en el periodo de comparacion ('+rgLabel(R.lo,R.hi)+') para los filtros seleccionados.</div>';return;}
  const a=inMV(A),b=inMV(B);
  const delta=(x,y,t)=>{if(x==null||y==null)return'&mdash;';const d=x-y;const arrow=d>0?'&#9650; ':d<0?'&#9660; ':'';
    if(t==='p')return arrow+(d>0?'+':'')+(d*100).toFixed(1).replace('.',',')+' pp';
    if(t==='$')return arrow+(d>0?'+':d<0?'-':'')+fmtMoney(Math.abs(d))+(y?' ('+(d>0?'+':'')+(d/y*100).toFixed(1).replace('.',',')+'%)':'');
    return arrow+(d>0?'+':'')+d;};
  const lA=rgLabel(lo,hi),lB=rgLabel(R.lo,R.hi);
  const tbl='<div class="tablebox"><table class="timeline"><thead><tr><th style="text-align:left">Metrica</th><th>Actual<br><span class="note">'+lA+'</span></th><th>Comparacion<br><span class="note">'+lB+'</span></th><th>Variacion (actual &minus; comparacion)</th></tr></thead><tbody>'
   +IN_MDEF.map(d=>'<tr><td style="text-align:left;font-weight:700">'+d[0]+'</td><td style="text-align:right">'+inFmtM(a[d[1]],d[2])+'</td><td style="text-align:right">'+inFmtM(b[d[1]],d[2])+'</td><td style="text-align:right">'+delta(a[d[1]],b[d[1]],d[2])+'</td></tr>').join('')+'</tbody></table></div>';
  const off=(d0)=>d=>{const n=Math.round((dayMs(d)-dayMs(d0))/864e5);return{t:n*864e5,lbl:'Dia '+(n+1)};};
  const one=(obs,d0,label,color)=>{const s=inAccum(obs,()=>label,()=>label,off(d0))[0];return s?{...s,color}:null;};
  IN_CMPS=[one(A,lo,'Actual: '+lA.replace(/&ndash;/g,'-'),PALETTE[0]),one(B,R.lo,'Comparacion: '+lB.replace(/&ndash;/g,'-'),PALETTE[1])].filter(Boolean);
  box.innerHTML='<div class="panel"><div class="chartHead"><div><h3>Comparacion de periodos</h3><div class="sub">Filtros de fabricante, SKU, marca y segmento aplicados a ambos periodos. El dia 1 es el primer dia calendario de cada periodo.</div></div></div>'+(R.lo<inAvail().list[0]?'<div class="note" style="margin-bottom:8px">&#9888; El historico empieza el '+fmtDMY(inAvail().list[0])+': el periodo de comparacion esta incompleto y no es equivalente al actual.</div>':'')+tbl
   +'<div class="chartBox" id="inChartC" style="margin-top:14px"></div><div class="chartLegend">'+IN_CMPS.map(s=>'<span><span class="legdot" style="background:'+s.color+'"></span>'+esc(s.label)+'</span>').join('')+'</div></div>';
  inDrawCmpChart();
}
function inDrawCmpChart(){if(el('inChartC'))inLines('inChartC',IN_CMPS,IN_CMPS.length);}

/* ---- Tabla de detalle: orden, busqueda, paginado y export ---- */
function inTableRows(){
  const q=normTxt(IN.tq),dir=IN.sortDir==='asc'?1:-1,k=IN.sortKey;
  const r=IN_OBS.filter(o=>!q||normTxt(o.sku+' '+o.marca+' '+o.fab+' '+o.seg).includes(q));
  const cmpD=(a,b)=>a.d<b.d?-1:a.d>b.d?1:0,cmpS=(a,b)=>a.sku.localeCompare(b.sku);
  r.sort((a,b)=>dir*(k==='fecha'?(cmpD(a,b)||cmpS(a,b)):k==='sku'?(cmpS(a,b)||cmpD(a,b)):(((a.din??-1)-(b.din??-1))||cmpD(a,b))));
  return r;
}
function inTq(v){IN.tq=v;IN.page=1;inDrawTable();}
function inSort(k){if(IN.sortKey===k)IN.sortDir=IN.sortDir==='asc'?'desc':'asc';else{IN.sortKey=k;IN.sortDir=k==='sku'?'asc':'desc';}IN.page=1;inDrawTable();}
function inPage(n){IN.page=n;inDrawTable();}
function inDrawTable(){
  const y=window.scrollY,rs=inTableRows(),pages=Math.max(1,Math.ceil(rs.length/IN_PAGE));IN.page=Math.min(Math.max(1,IN.page),pages);
  const from=(IN.page-1)*IN_PAGE,slice=rs.slice(from,from+IN_PAGE);
  const th=(k,t)=>'<th class="sortable" onclick="inSort(\''+k+'\')">'+t+(IN.sortKey===k?(IN.sortDir==='asc'?' &#9650;':' &#9660;'):'')+'</th>';
  el('inTable').innerHTML='<table class="timeline"><thead><tr>'+th('fecha','Fecha')+'<th>Fabricante</th><th>Marca</th><th>Segmento</th>'+th('sku','SKU')+'<th>Precio final (PTC)</th><th>Precio tachado</th>'+th('din','Dinamica')+'</tr></thead><tbody>'
   +(slice.length?slice.map(o=>'<tr><td>'+fmtDMY(o.d)+'</td><td>'+esc(o.fab)+'</td><td>'+esc(o.marca)+'</td><td>'+esc(o.seg)+'</td><td class="skucell">'+esc(o.sku)+'</td><td style="text-align:right">'+fmtMoney(o.ptc)+(o.sosp?' <span title="Marcado como sospechoso por el scraper">&#9888;</span>':'')+'</td><td style="text-align:right">'+(o.tach==null?'&mdash;':fmtMoney(o.tach))+'</td><td style="text-align:right">'+(o.din==null?'&mdash;':fmtPct1(o.din))+'</td></tr>').join(''):'<tr><td colspan="8" class="note" style="text-align:center;padding:24px">Sin resultados para la busqueda</td></tr>')+'</tbody></table>';
  el('inPager').innerHTML='<span class="note">'+(rs.length?'Mostrando '+(from+1)+'&ndash;'+(from+slice.length)+' de '+rs.length:'0 resultados')+'</span><span style="display:flex;gap:8px;align-items:center"><button type="button" class="pgbtn" onclick="inPage('+(IN.page-1)+')"'+(IN.page<=1?' disabled':'')+'>&lsaquo; Anterior</button><span class="note">Pagina '+IN.page+' de '+pages+'</span><button type="button" class="pgbtn" onclick="inPage('+(IN.page+1)+')"'+(IN.page>=pages?' disabled':'')+'>Siguiente &rsaquo;</button></span>';
  current=rs.map(inCsvRow);window.scrollTo(0,y);
}
const inCsvRow=o=>({Fecha:o.d,Fabricante:o.fab,Marca:o.marca,Segmento:o.seg,SKU:o.sku,'Precio final (PTC)':o.ptc??'','Precio tachado':o.tach??'','Dinamica %':o.din==null?'':Number((o.din*100).toFixed(2))});
function inExport(){
  const rs=inTableRows().map(inCsvRow);if(!rs.length)return;
  const k=Object.keys(rs[0]),q=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replaceAll('"','""')+'"':v;};
  const csv='﻿'+[k.join(';')].concat(rs.map(r=>k.map(x=>q(r[x])).join(';'))).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='pedidosya_insights.csv';a.click();
}

function render(){el('content').innerHTML=tab==='timeline'?timeline():tab==='preciolitro'?precioLitro():tab==='comparar'?comparar():tab==='heatmap'?heatmap():tab==='changes'?changes():insights();if(tab==='insights')inUpdate();}
function downloadCSV(){if(!current.length)return;const k=Object.keys(current[0]);const csv=[k.join(';')].concat(current.map(r=>k.map(x=>String(r[x]??'').replaceAll(';',',')).join(';'))).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pedidosya_vista.csv';a.click();}

/* ---- Grafico de evolucion de 1 SKU (click en un producto en Evolucion/Heatmap) ---- */
function closeChart(){const p=el('chartPanel');p.classList.remove('open');p.innerHTML='';}
function openChart(id){const r=DATA.pivot.find(x=>x.id===id);if(!r)return;const D=dates();const pts=D.map(d=>({d,v:r.dates[d]})).filter(p=>p.v&&p.v.ptc!=null);const p=el('chartPanel');if(!pts.length){p.classList.add('open');p.innerHTML='<div class="chartHead"><div><h3>'+r.marca+' '+r.calibre+'</h3><div class="sub">'+r.sku+'</div></div><button class="chartClose" onclick="closeChart()">Cerrar &times;</button></div><p class="note">Sin historico suficiente todavia.</p>';p.scrollIntoView({behavior:'smooth',block:'nearest'});return;}
  const W=Math.max(560,pts.length*70),H=220,padL=54,padR=18,padT=18,padB=34;
  const vals=pts.map(p=>p.v.ptc);const min=Math.min(...vals),max=Math.max(...vals);const span=(max-min)||1;
  const x=i=>padL+(pts.length===1?0:(i*(W-padL-padR)/(pts.length-1)));
  const y=v=>padT+(H-padT-padB)*(1-(v-min)/span);
  const linePath=pts.map((pt,i)=>(i===0?'M':'L')+x(i).toFixed(1)+','+y(pt.v.ptc).toFixed(1)).join(' ');
  const areaPath=linePath+' L'+x(pts.length-1).toFixed(1)+','+(H-padB)+' L'+x(0).toFixed(1)+','+(H-padB)+' Z';
  const gridY=[0,.25,.5,.75,1].map(t=>padT+(H-padT-padB)*t);
  let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="240" preserveAspectRatio="xMinYMid meet" style="overflow:visible">';
  gridY.forEach(gy=>svg+='<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>');
  svg+='<path d="'+areaPath+'" fill="var(--green)" opacity="0.08" stroke="none"/>';
  svg+='<path d="'+linePath+'" fill="none" stroke="var(--green)" stroke-width="2.5"/>';
  pts.forEach((pt,i)=>{const cx=x(i).toFixed(1),cy=y(pt.v.ptc).toFixed(1);
    svg+='<circle cx="'+cx+'" cy="'+cy+'" r="4.5" fill="var(--blue)" stroke="var(--panel)" stroke-width="1.5"/>';
    svg+='<text x="'+cx+'" y="'+(Number(cy)-10)+'" font-size="10.5" font-weight="800" fill="var(--ink)" text-anchor="middle">'+fmtMoney(pt.v.ptc)+'</text>';
    svg+='<text x="'+cx+'" y="'+(H-padB+16)+'" font-size="10" fill="var(--muted)" text-anchor="middle">'+fmtDate(pt.d)+'</text>';
  });
  svg+='</svg>';
  const first=pts[0].v.ptc,lastv=pts[pts.length-1].v.ptc,delta=lastv-first,deltaPct=first?(delta/first*100):0;
  p.classList.add('open');
  p.innerHTML='<div class="chartHead"><div><h3>'+r.marca+' '+r.calibre+'</h3><div class="sub">'+r.sku+' &middot; '+r.grupo+' / '+r.segmento+'</div></div><button class="chartClose" onclick="closeChart()">Cerrar &times;</button></div>'+
    '<div style="overflow-x:auto">'+svg+'</div>'+
    '<div class="chartLegend"><span>Variacion total: <b class="'+(delta>0?'gapBad':delta<0?'gapGood':'')+'" style="color:'+(delta>0?'var(--red)':delta<0?'var(--green)':'var(--yellow)')+'">'+(delta>0?'+':'')+fmtMoney(delta)+' ('+(deltaPct>0?'+':'')+deltaPct.toFixed(1)+'%)</b></span></div>';
  p.scrollIntoView({behavior:'smooth',block:'nearest'});
}
cargar();
</script>
